name: Update events
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:
  push:                       # an edit saved in the app shows up for everyone within a couple of minutes
    branches: [main]
    paths: [docs/overrides.json, docs/parents.json, docs/sources.json]
permissions:
  contents: write
concurrency:
  group: update-events
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Build events
        working-directory: backend
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_CODES: ${{ secrets.ACCESS_CODES }}   # one code per line; the feed is locked when set
        run: python build_events.py
      - name: Publish locked feed
        if: ${{ hashFiles('feed/events.locked.json') != '' }}
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}       # can write only to the shiloh-feed repo
        run: |
          if [ -z "$FEED_TOKEN" ]; then echo "::error::The FEED_TOKEN secret is empty or missing"; exit 1; fi
          mkdir /tmp/feed && cp feed/events.locked.json /tmp/feed/ && cd /tmp/feed
          git init -q -b main
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events.locked.json && git commit -q -m "Update feed"
          # One commit only, so old copies don't pile up.
          git push -q -f "https://hal0428-golf:$(printf %s "$FEED_TOKEN" | tr -d '[:space:]')@github.com/hal0428-golf/shiloh-feed.git" main
      - name: Commit changes
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add -A -- docs backend/data
          # The app may save docs/overrides.json while this runs, so rebase onto it before pushing.
          git diff --cached --quiet || (git commit -m "Update events" && git pull --rebase && git push)
